# FilePath: scripts/models/indic-flex/pyproject.toml
[project]
name = "indic-flex-coreml"
version = "0.1.0"
description = "Converts bodhan-ai/indic-transcribe-flex to FluidAudio's Canary Core ML int4 layout and publishes it"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "coremltools==9.0",
    "nemo_toolkit[asr]==2.7.3",
    "huggingface_hub[cli]==0.36.2",
    "numpy==2.2.6",
    "sentencepiece==0.2.3",
    "soundfile==0.14.0",
    "psutil==7.2.2",
]

[tool.uv]
package = false
# Core ML export and compilation only run on Apple Silicon macOS.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
