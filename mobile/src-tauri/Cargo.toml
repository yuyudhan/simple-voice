# FilePath: mobile/src-tauri/Cargo.toml
[package]
name = "simple-voice-mobile"
description = "Simple Voice for iPhone and Android: history, dictionary, insights and settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
