name: simple-voice-mobile
options:
  bundleIdPrefix: dev.yuyudhan.simplevoice.mobile
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
settings:
  base:
    # Swift 5 language mode: the plugin and extensions predate Swift 6 strict concurrency.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.0.7
    CURRENT_PROJECT_VERSION: 0.0.7
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Simple Voice
      PRODUCT_BUNDLE_IDENTIFIER: dev.yuyudhan.simplevoice.mobile
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  simple-voice-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: simple-voice-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # The Live Activity's Stop button runs in the app's process, so the app compiles it too.
      - path: SimpleVoiceWidget/EndSessionIntent.swift
    info:
      path: simple-voice-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        # The iOS 27 SDK requires the scene life cycle; this key makes tao use its scene delegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.0.7
        CFBundleVersion: "0.0.7"
        # The keyboard opens the app with simplevoice:// to start a recording session.
        CFBundleURLTypes:
          - CFBundleURLName: dev.yuyudhan.simplevoice.mobile
            CFBundleURLSchemes: [simplevoice]
        NSMicrophoneUsageDescription: Simple Voice records what you say in its keyboard and turns it into text.
        NSSpeechRecognitionUsageDescription: Without internet, Simple Voice transcribes on this iPhone with Apple Speech.
        NSSupportsLiveActivities: true
        # A session keeps the microphone running while you type in other apps.
        UIBackgroundModes: [audio]
    entitlements:
      path: simple-voice-mobile_iOS/simple-voice-mobile_iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.yuyudhan.simplevoice.mobile]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: SimpleVoiceKeyboard
      - target: SimpleVoiceWidget
      - framework: libapp.a
        embed: false
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework
      - sdk: Speech.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          cargo tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # The keyboard (MB-2): typing on its own, dictation through the app's session via the App Group.
  SimpleVoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: SimpleVoiceKeyboard
        excludes: ["*.plist", "*.entitlements"]
      - path: ../../../plugins/sv-native/ios/Sources/SvShared
    settings:
      base:
        PRODUCT_NAME: SimpleVoiceKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuyudhan.simplevoice.mobile.keyboard
        INFOPLIST_FILE: SimpleVoiceKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: SimpleVoiceKeyboard/SimpleVoiceKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        GENERATE_INFOPLIST_FILE: false
  # The session's Live Activity (MB-7).
  SimpleVoiceWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SimpleVoiceWidget
        excludes: ["*.plist"]
      - path: ../../../plugins/sv-native/ios/Sources/SvShared
    settings:
      base:
        PRODUCT_NAME: SimpleVoiceWidget
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuyudhan.simplevoice.mobile.widget
        INFOPLIST_FILE: SimpleVoiceWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
