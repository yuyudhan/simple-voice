<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <!-- FilePath: branding/icon.svg -->
    <!-- Simple Voice app icon: a warm cream squircle on the macOS 824 px icon grid with a deep
         teal voice-level waveform. Rendered to branding/icon.png, the source of src-tauri/icons. -->
    <defs>
        <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FDF9F1"/>
            <stop offset="0.55" stop-color="#F7EFE1"/>
            <stop offset="1" stop-color="#EEE2CC"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#D9C9AC" stop-opacity="0.6"/>
        </linearGradient>
        <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#16786F"/>
            <stop offset="1" stop-color="#0F5E57"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
            <feOffset dy="12"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.28"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="barShadow" x="-50%" y="-20%" width="200%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dy="6"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.18"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <g filter="url(#shadow)">
        <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#paper)"/>
        <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#glow)"/>
        <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" ry="184.5" fill="none"
            stroke="url(#rim)" stroke-width="3"/>
    </g>

    <g fill="url(#ink)" filter="url(#barShadow)">
        <rect x="221" y="444" width="54" height="136" rx="27"/>
        <rect x="309" y="372" width="54" height="280" rx="27"/>
        <rect x="397" y="292" width="54" height="440" rx="27"/>
        <rect x="485" y="232" width="54" height="560" rx="27"/>
        <rect x="573" y="322" width="54" height="380" rx="27"/>
        <rect x="661" y="400" width="54" height="224" rx="27"/>
        <rect x="749" y="458" width="54" height="108" rx="27"/>
    </g>
</svg>
