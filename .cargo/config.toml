# FilePath: .cargo/config.toml
# whisper.cpp (the Linux engine helper, via whisper-rs-sys) builds for the CPU it compiles on
# unless told otherwise, and such a binary dies with SIGILL on an older CPU. Releases target any
# x86-64 CPU with AVX2 and FMA (Intel Haswell, AMD Zen and later). Only whisper-rs-sys reads the
# GGML_* variables.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
# sherpa-onnx's prebuilt static libraries (Parakeet in the Linux engine helper) are built on
# manylinux with the pre-C++11 libstdc++ string ABI. whisper.cpp in the same binary must use it
# too: both instantiate std::regex, the linker keeps one copy, and with mixed ABIs ONNX Runtime
# then frees a pointer it does not own and the helper aborts while loading Parakeet.
CXXFLAGS_x86_64_unknown_linux_gnu = "-D_GLIBCXX_USE_CXX11_ABI=0"
