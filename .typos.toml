# FilePath: .typos.toml
# Spellcheck configuration for `typos` (`just lint`, pre-commit, CI). Kept minimal: a word that
# is correct in this codebase's own vocabulary goes into [default.extend-words] with a comment
# saying why; the exclusions cover only machine-generated content nobody hand-writes, so a real
# typo in prose or identifiers still gets caught.

[files]
extend-exclude = [
    "bun.lock",
    "Cargo.lock",
    ".sqlx/",
    "src-tauri/icons/",
    "src-tauri/gen/",
    "target/",
    "node_modules/",
    "dist/",
    "engine/.build/",
    "engine/Package.resolved",
    # Generated from SCOWL (see its header); British and archaic spellings are words there.
    "crates/sv-text/src/sound_alike/common_words.txt",
]

[default.extend-words]
# Microphone brand used in device-selection tests.
Shure = "Shure"
# Built-in vocabulary pack terms (crates/sv-text/src/packs/): Chief Marketing Officer and the
# design app, both spelled as their owners write them.
CMO = "CMO"
Canva = "Canva"
# Romanised Hindi in the eval corpus (scripts/eval/say-corpus.tsv): "tak" (until), "chalenge"
# (will go).
tak = "tak"
chalenge = "chalenge"
