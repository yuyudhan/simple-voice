# FilePath: engine-linux/Cargo.toml
# The engine helper on Linux. macOS keeps the Swift helper in engine/; this crate speaks the same
# JSON-lines protocol (docs/internal/engine.md) so the app talks to either through one client.
# Its dependencies are Linux-only, so on macOS it builds to a binary that only says where it
# belongs and the workspace gates never compile whisper.cpp there.
[package]
name = "simple-voice-engine-linux"
description = "Simple Voice's engine helper for Linux: Whisper transcription (whisper.cpp) and desktop integration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "simple-voice-engine"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
sv-domain.workspace = true
sv-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
whisper-rs.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
